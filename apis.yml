  name: Klaxoon API
  description: >-
    The Klaxoon API allows developers to integrate Klaxoon's collaborative features into their applications,
    enabling automation of board creation, activity management, and participant engagement. It includes
    the Board API, Activity Picker, Klaxoon Embed, Audit Logs API, SCIM API, and Participant Activity
    Report API.
